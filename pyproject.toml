[project]
name = "advent-of-code"
version = "0.1.0"
description = "Dazbo's Advent of Code solutions."
authors = [
    { name = "Darren", email = "derailed.dash@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }

dependencies = [
    "colorama",
    "dazbo-commons>=0.2.0",
    "graphviz",
    "imageio",
    "matplotlib",
    "networkx",
    "numpy",
    "pandas",
    "parsimonious",
    "pillow",
    "python-dotenv",
    "regex",
    "requests",
    "rich>=14.2.0",
    "scipy",
    "sympy",
    "tqdm",
]

[project.urls]
Homepage = "https://aoc.just2good.co.uk/"
Repository = "https://github.com/derailed-dash/Advent-of-Code"
Portfolio = "https://darrenlester.net"
Blog = "https://medium.com/@dazbo"

[dependency-groups]
dev = [
    "codespell",
    "pyright",
    "pytest",
    "ruff",
    "types-requests",
]

[project.optional-dependencies]
jupyter = [
    "ipykernel",
    "ipython",
    "ipywidgets",
    "jupyter",
    "jupyterlab",
    "jupyterlab-lsp",
]

[tool.ruff]
line-length = 130
target-version = "py313"
extend-exclude = ["src/AoC_201*", "src/AoC_202[0-5]"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff specific rules
]
# ignore line too long, too complex, two blank lines, trailing whitespace
ignore = [
    "B905", # ignore strict zip requirement
    "E302", # expected two blank lines between defs
    "W291", # trailing whitespace
    "W293", # line contains whitespace
]
per-file-ignores = { "__init__.py" = ["F401"], "**/__init__.py" = ["F401"], "*.ipynb" = ["F401"] }

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]

[tool.pyright]
include = ["src/aoc_common", "src/tests", "src/template_folder"]
extraPaths = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "standard"

[tool.codespell]
skip = "*.lock,uv.lock,*input*.txt,.git,.venv,.pytest_cache,.ruff_cache,./src/AoC_201*,./src/AoC_202[0-5],./docs/_site,./docs/.jekyll-cache,./docs/.sass-cache,./docs/.jekyll-metadata,./docs/201*,./docs/202[0-5],./docs/Gemfile*,*.drawio"
ignore-words-list = "ore,ans,nd,rouge,parms,deques"

[tool.setuptools.packages.find]
where = ["src"]
