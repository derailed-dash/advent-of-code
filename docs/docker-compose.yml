services:
  jekyll-aoc:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: aoc-jekyll:local
    container_name: dazbo-jekyll-aoc
    working_dir: /workspace/docs
    environment:
      - JEKYLL_ENV=docker
      - JEKYLL_GITHUB_TOKEN
    volumes:
      - ..:/workspace
    ports:
      - "127.0.0.1:4000:4000"
      - "127.0.0.1:35729:35729"
