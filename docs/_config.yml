# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you: 
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Learning Python with Advent of Code Walkthroughs
description: Dazbo's Advent of Code solutions, written in Python

# We need the URLs below otherwise overriding CSS won't work
repository: derailed-dash/Advent-of-Code
baseurl: ""
url: https://aoc.just2good.co.uk

twitter_username: DerailedDash
github_username:  derailed-dash
author: Dazbo

# Build settings
theme: jekyll-theme-modernist
plugins:
  - jekyll-relative-links
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-titles-from-headings
  - jekyll-redirect-from

# Exclude from processing. (Note that files/dirs starting with _, . or # are automatically excluded.)
exclude:
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - docker-compose.yml
  - _config.docker.yml
  - readme.md
  - .env
  - .env.enc
  - .env.template
  - vendor/
  - 2022/day_template.md
  - python/parsimonious.md

defaults:
  - scope:
      path: ""  # Everything
    values:
      layout: "day-page"  # most of our pages will use this layout; use default for index
      topic: "Advent of Code"
  - scope:  # exclude the domain ownership verification from sitemap
      path: google*.html
    values:
      sitemap: false
  - scope:
      path: "python"
    values:
      layout: "journey-page" 
      topic: "The Python Journey"
  - scope:
      path: "2015"  # only apply to files in this folder
    values:
      year: 2015
  - scope:
      path: "2016"  # only apply to files in this folder
    values:
      year: 2016
  - scope:
      path: "2017"  # only apply to files in this folder
    values:
      year: 2017
  - scope:
      path: "2018"  # only apply to files in this folder
    values:
      year: 2018
  - scope:
      path: "2020"  # only apply to files in this folder
    values:
      year: 2020
  - scope:
      path: "2021"  # only apply to files in this folder
    values:
      year: 2021
  - scope:
      path: "2022"  # only apply to files in this folder
    values:
      year: 2022
  - scope:
      path: "2023"  # only apply to files in this folder
    values:
      year: 2023
  - scope:
      path: "2024"  # only apply to files in this folder
    values:
      year: 2024
  - scope:
      path: "2025"  # only apply to files in this folder
    values:
      year: 2025
  - scope:
      path: "2026"  # only apply to files in this folder
    values:
      year: 2026
