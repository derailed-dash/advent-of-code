<script>
  (function () {
    var theme = "dark";
    try {
      var saved = localStorage.getItem("aoc-theme");
      if (saved === "light" || saved === "dark") {
        theme = saved;
      }
    } catch (err) {}
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
