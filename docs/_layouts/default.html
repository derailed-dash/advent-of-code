{% assign build_rev = site.github.build_revision | default: '1' %}
<!doctype html>
<html lang="{{ site.lang | default: 'en-GB' }}" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">

{% seo %}

    {% include head-custom.html %}

    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: build_rev | relative_url }}">
    <script defer src="{{ '/assets/js/site.js?v=' | append: build_rev | relative_url }}"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    {% include header.html %}

    <div id="site-shell" class="site-shell">
      <div id="drawer-backdrop" class="drawer-backdrop" aria-hidden="true"></div>

      {% include sidebar.html %}

      <main id="main-content" class="site-main" tabindex="-1">
        <article id="article-content" class="reading-card prose">
          {{ content }}
        </article>
      </main>

      {% include toc.html %}
    </div>

    {% include footer.html %}
  </body>
</html>
